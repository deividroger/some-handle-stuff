name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/api/go.mod
          cache-dependency-path: src/api/go.sum

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build ./...

      - name: Verify Swagger docs are up to date
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/api/main.go --parseDependency --parseInternal
          git diff --exit-code docs

  ui:
    name: UI (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/todo-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/todo-ui/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [api, ui]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Smoke test stack
        run: |
          docker compose up -d --wait --wait-timeout 120 api
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/healthz
          docker compose up -d --wait ui
          curl --fail http://localhost:3000/api/tasks
          docker compose down -v

      - name: Show logs on failure
        if: failure()
        run: docker compose logs
